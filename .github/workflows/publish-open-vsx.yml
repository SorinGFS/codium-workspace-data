# Publish the exact GitHub release artifact to Open VSX with the repository secret.
name: Publish Open VSX

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing GitHub release tag to publish
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish:
    name: Publish release VSIX
    runs-on: ubuntu-latest
    steps:
      # Provide the runtime required by the pinned Open VSX CLI.
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      # Download the named release artifact instead of rebuilding a potentially different package.
      - name: Download release VSIX
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          version="${RELEASE_TAG#v}"
          asset="codium-workspace-data-${version}.vsix"
          mkdir artifact
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern "$asset" --dir artifact
          test -f "artifact/$asset" && test ! -L "artifact/$asset"
          printf 'VSIX_PATH=%s\n' "artifact/$asset" >> "$GITHUB_ENV"

      # Use the pinned official CLI only after the release artifact passes the file check.
      - name: Publish to Open VSX
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: npx --yes ovsx@1.2.0 publish "$VSIX_PATH"
