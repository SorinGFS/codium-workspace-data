# Verify the extension without lifecycle scripts or workspace filesystem links.
name: Cross-platform tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Node.js ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [20, 22, 24]

    steps:
      # Check out the exact workflow revision.
      - name: Check out repository
        uses: actions/checkout@v7

      # Install one supported build runtime per matrix entry.
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      # Prevent package scripts and executable links while restoring pinned development tools.
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-bin-links

      # Compile strict TypeScript and exercise protocol validation.
      - name: Test
        run: npm test

      # Verify the publishable archive layout on every supported host.
      - name: Package VSIX
        run: npm run package
